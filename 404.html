<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex"
    >

    <title>Page Not Found | Nexora</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body class="nexora-404-page">


    <!-- BACKGROUND -->

    <div class="error-background">

        <div class="error-grid"></div>

        <div class="error-glow"></div>

    </div>



    <!-- NAV -->

    <header class="error-header">

        <a href="/" class="error-logo">

            <img
                src="/images/nexora-logo.png"
                alt="Nexora"
            >

        </a>

        <a
            href="/login.html"
            class="error-login"
        >
            Client Login
        </a>

    </header>



    <!-- ERROR -->

    <main class="error-main">

        <div class="error-content">


            <div class="error-code">

                <span>4</span>

                <div class="error-zero">

                    <div class="error-zero-inner">
                        N
                    </div>

                </div>

                <span>4</span>

            </div>


            <div class="error-badge">

                <i></i>

                PAGE NOT FOUND

            </div>


            <h1>
                Looks like this page
                <span>got lost.</span>
            </h1>


            <p>
                The page you're looking for may have moved,
                been removed, or never existed.
            </p>


            <div class="error-actions">

                <a
                    href="/"
                    class="error-home-button"
                >
                    ← Back to Nexora
                </a>


                <a
                    href="/#contact"
                    class="error-contact-button"
                >
                    Contact Support
                </a>

            </div>


            <div class="error-help">

                <span>
                    Need help?
                </span>

                <a href="mailto:hello@nexora.ca">
                    hello@nexora.ca
                </a>

            </div>


        </div>

    </main>



    <!-- FOOTER -->

    <footer class="error-footer">

        <span>
            © <span id="errorYear"></span> Nexora
        </span>


        <div>

            <a href="/privacy.html">
                Privacy
            </a>

            <a href="/terms.html">
                Terms
            </a>

            <a href="/report-abuse.html">
                Report Abuse
            </a>

        </div>

    </footer>



    <script>

        document.getElementById("errorYear").textContent =
            new Date().getFullYear();

    </script>


</body>

</html>
